<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ScanPanan - Live Production Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #090d16; color: #e2e8f0; margin: 0; padding: 30px; }
        .wrapper { max-width: 900px; margin: auto; background: #111827; padding: 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); border: 1px solid #1f2937; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
        .card { background: #1f2937; padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #374151; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0f19; border: 1px solid #4b5563; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        button { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 14px 20px; width: 100%; border-radius: 8px; font-size: 17px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: linear-gradient(135deg, #0369a1, #075985); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); }
        pre { background: #090d16; padding: 20px; border-radius: 8px; overflow-x: auto; color: #4ade80; border: 1px solid #1e293b; font-family: 'Courier New', Courier, monospace; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; background: #065f46; color: #34d399; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="wrapper">
    <h1>ScanPanan Production System</h1>
    <p class="subtitle">ระบบสแกน วิเคราะห์ และปรับปรุงอัตราชนะแบบเรียลไทม์ (Live Engine)</p>

    <div class="card">
        <span class="status-badge">API Connected</span>
        <label>เป้าหมาย URL (Target Endpoint):</label>
        <input type="text" id="targetUrl" value="https://example.com/game-lobby">

        <label>อัตราชนะที่ต้องการ (%) [Target Win Rate]:</label>
        <input type="number" id="targetRate" value="92.5" step="0.1">

        <button onclick="runLiveScanPanan()">เริ่มสแกนและปรับแต่งระบบทันที</button>
    </div>

    <div class="card">
        <h3>ผลลัพธ์การทำงานจริง (Execution Output Log):</h3>
        <pre id="resultLog">ระบบพร้อมทำงาน... กรุณากดปุ่มเพื่อเริ่มกระบวนการ</pre>
    </div>
</div>

<script>
async function runLiveScanPanan() {
    const url = document.getElementById('targetUrl').value;
    const rate = parseFloat(document.getElementById('targetRate').value);
    const logBox = document.getElementById('resultLog');

    logBox.innerText = "กำลังส่งคำสั่งสแกนเป้าหมายและเรียกใช้ AI Optimization Engine...";

    try {
        const response = await fetch('http://localhost:8000/api/scan-and-optimize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url, win_rate: rate })
        });
        
        const data = await response.json();
        logBox.innerText = JSON.stringify(data, null, 2);
    } catch (err) {
        logBox.innerText = "Error: ไม่สามารถเชื่อมต่อกับ Server Backend ได้\n(โปรดตรวจสอบว่าได้รันคำสั่ง uvicorn api_server:app --reload แล้วหรือยัง)";
    }
}
</script>
</body>
</html>
